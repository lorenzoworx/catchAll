name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Python tests
        run: python -m pytest -q

      - name: Lint Python
        run: python -m ruff check .

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Configure native tests
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build build/native --config Release

      - name: Run native tests
        run: ctest --test-dir build/native --build-config Release --output-on-failure
