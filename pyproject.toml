[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "catchall"
version = "0.1.0"
description = "Stable real-time captions with an optional plain-language view"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"
wheel.packages = ["catchall"]